AWSTemplateFormatVersion: '2010-09-09'
Description: One-time private buckets and GitHub OIDC deployment role for Bubble-Bounce-Games/lattice. Create in ap-southeast-1.
Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: lattice.abhijeet-anand.com
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub lattice-deploy-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsLatticeDeploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:Bubble-Bounce-Games/lattice:environment:aws-s3
      Policies:
        - PolicyName: LatticeDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  [
                    s3:ListBucket,
                    s3:GetBucketLocation,
                    s3:GetBucketPolicy,
                    s3:PutBucketPolicy,
                    s3:DeleteBucketPolicy,
                  ]
                Resource: [!GetAtt WebsiteBucket.Arn, !GetAtt ArtifactBucket.Arn]
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: [!Sub '${WebsiteBucket.Arn}/*', !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action:
                  [
                    cloudformation:CreateStack,
                    cloudformation:UpdateStack,
                    cloudformation:DescribeStacks,
                    cloudformation:DescribeStackEvents,
                    cloudformation:GetTemplate,
                    cloudformation:GetTemplateSummary,
                    cloudformation:CreateChangeSet,
                    cloudformation:DescribeChangeSet,
                    cloudformation:ExecuteChangeSet,
                    cloudformation:DeleteChangeSet,
                    cloudformation:DescribeStackResources,
                    cloudformation:ListStackResources,
                  ]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/lattice-*/*
              - Effect: Allow
                Action:
                  [
                    lambda:CreateFunction,
                    lambda:UpdateFunctionCode,
                    lambda:UpdateFunctionConfiguration,
                    lambda:GetFunction,
                    lambda:GetFunctionConfiguration,
                    lambda:DeleteFunction,
                    lambda:AddPermission,
                    lambda:RemovePermission,
                    lambda:ListTags,
                    lambda:TagResource,
                    lambda:UntagResource,
                  ]
                Resource: !Sub arn:${AWS::Partition}:lambda:ap-southeast-1:${AWS::AccountId}:function:lattice-api
              - Effect: Allow
                Action:
                  [
                    dynamodb:CreateTable,
                    dynamodb:DescribeTable,
                    dynamodb:DeleteTable,
                    dynamodb:UpdateTable,
                    dynamodb:UpdateTimeToLive,
                    dynamodb:DescribeTimeToLive,
                    dynamodb:UpdateContinuousBackups,
                    dynamodb:DescribeContinuousBackups,
                    dynamodb:ListTagsOfResource,
                    dynamodb:TagResource,
                    dynamodb:UntagResource,
                  ]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:ap-southeast-1:${AWS::AccountId}:table/lattice-api-*
              - Effect: Allow
                Action:
                  [
                    iam:CreateRole,
                    iam:GetRole,
                    iam:PutRolePolicy,
                    iam:GetRolePolicy,
                    iam:DeleteRolePolicy,
                    iam:DeleteRole,
                    iam:TagRole,
                    iam:UntagRole,
                  ]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/lattice-api-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/lattice-api-*
                Condition: { StringEquals: { 'iam:PassedToService': lambda.amazonaws.com } }
              - Effect: Allow
                Action:
                  [
                    logs:CreateLogGroup,
                    logs:DeleteLogGroup,
                    logs:PutRetentionPolicy,
                    logs:DeleteRetentionPolicy,
                    logs:ListTagsForResource,
                    logs:TagResource,
                    logs:UntagResource,
                  ]
                Resource: !Sub arn:${AWS::Partition}:logs:ap-southeast-1:${AWS::AccountId}:log-group:/aws/lambda/lattice-api:*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Effect: Allow
                Action:
                  [
                    apigateway:GET,
                    apigateway:POST,
                    apigateway:PUT,
                    apigateway:PATCH,
                    apigateway:DELETE,
                  ]
                Resource: !Sub arn:${AWS::Partition}:apigateway:ap-southeast-1::/apis*
              - Effect: Allow
                Action:
                  [
                    cloudfront:CreateDistribution,
                    cloudfront:GetDistribution,
                    cloudfront:GetDistributionConfig,
                    cloudfront:UpdateDistribution,
                    cloudfront:DeleteDistribution,
                    cloudfront:CreateOriginAccessControl,
                    cloudfront:GetOriginAccessControl,
                    cloudfront:UpdateOriginAccessControl,
                    cloudfront:DeleteOriginAccessControl,
                    cloudfront:CreateFunction,
                    cloudfront:DescribeFunction,
                    cloudfront:GetFunction,
                    cloudfront:UpdateFunction,
                    cloudfront:PublishFunction,
                    cloudfront:DeleteFunction,
                    cloudfront:TagResource,
                    cloudfront:UntagResource,
                    cloudfront:ListTagsForResource,
                    cloudfront:CreateInvalidation,
                    cloudfront:GetInvalidation,
                  ]
                Resource: '*'
              - Effect: Allow
                Action: [acm:DescribeCertificate, acm:GetCertificate]
                Resource: !Sub arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*
Outputs:
  DeployRoleArn: { Value: !GetAtt DeployRole.Arn }
  WebsiteBucket: { Value: !Ref WebsiteBucket }
  ArtifactBucket: { Value: !Ref ArtifactBucket }
