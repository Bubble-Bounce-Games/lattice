name: Deploy Lattice AWS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: lattice-aws
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: aws-s3
    env:
      AWS_REGION: ap-southeast-1
      WEBSITE_BUCKET: lattice.abhijeet-anand.com
      ARTIFACT_BUCKET: lattice-deploy-990723918097-ap-southeast-1
      DOMAIN_NAME: lattice.abhijeet-anand.com
      CERTIFICATE_ARN: ${{ vars.CLOUDFRONT_CERTIFICATE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:aws
      - name: Check certificate configuration
        run: |
          if [ -z "$CERTIFICATE_ARN" ]; then
            echo "Set CLOUDFRONT_CERTIFICATE_ARN in the aws-s3 environment after requesting and validating a us-east-1 certificate for $DOMAIN_NAME. See docs/aws-deployment.md."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::990723918097:role/GitHubActionsLatticeDeploy
          aws-region: ap-southeast-1
      - name: Verify AWS account and certificate
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "990723918097"
          test "$(aws acm describe-certificate --region us-east-1 --certificate-arn "$CERTIFICATE_ARN" --query Certificate.Status --output text)" = "ISSUED"
      - name: Upload Lambda artifact
        run: |
          cd dist/aws/api
          zip ../api.zip index.js
          aws s3 cp ../api.zip "s3://$ARTIFACT_BUCKET/api/${GITHUB_SHA}.zip"
      - name: Deploy private library API
        run: |
          aws cloudformation deploy --stack-name lattice-api \
            --template-file aws/infrastructure/api.yml --capabilities CAPABILITY_IAM \
            --parameter-overrides CodeBucket="$ARTIFACT_BUCKET" CodeKey="api/${GITHUB_SHA}.zip" WebsiteOrigin="https://$DOMAIN_NAME" \
            --no-fail-on-empty-changeset
          API_HOST="$(aws cloudformation describe-stacks --stack-name lattice-api --query "Stacks[0].Outputs[?OutputKey=='ApiHost'].OutputValue" --output text)"
          echo "API_HOST=$API_HOST" >> "$GITHUB_ENV"
      - name: Upload website files
        run: |
          aws s3 sync dist/aws/website "s3://$WEBSITE_BUCKET" --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/aws/website/index.html "s3://$WEBSITE_BUCKET/index.html" --cache-control "public,max-age=60,must-revalidate" --content-type text/html
      - name: Deploy HTTPS and API routing
        run: |
          aws cloudformation deploy --region us-east-1 --stack-name lattice-edge \
            --template-file aws/infrastructure/edge.yml \
            --parameter-overrides WebsiteBucketName="$WEBSITE_BUCKET" WebsiteBucketRegion="$AWS_REGION" DomainName="$DOMAIN_NAME" CertificateArn="$CERTIFICATE_ARN" ApiHost="$API_HOST" \
            --no-fail-on-empty-changeset
          DISTRIBUTION_ID="$(aws cloudformation describe-stacks --region us-east-1 --stack-name lattice-edge --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
          aws cloudformation describe-stacks --region us-east-1 --stack-name lattice-edge --query 'Stacks[0].Outputs' --output table >> "$GITHUB_STEP_SUMMARY"
      - name: Show failure details
        if: failure()
        run: |
          aws cloudformation describe-stack-events --stack-name lattice-api --max-items 10 --output table || true
          aws cloudformation describe-stack-events --region us-east-1 --stack-name lattice-edge --max-items 10 --output table || true
