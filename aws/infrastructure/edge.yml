AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 origin, HTTPS, and uncached authenticated API for Lattice.
Parameters:
  WebsiteBucketName: { Type: String, Default: lattice.abhijeet-anand.com }
  WebsiteBucketRegion: { Type: String, Default: ap-southeast-1 }
  DomainName: { Type: String, Default: lattice.abhijeet-anand.com }
  CertificateArn: { Type: String, AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+' }
  ApiHost: { Type: String }
Resources:
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Routes:
    Type: AWS::CloudFront::Function
    Properties:
      Name: lattice-static-routes
      AutoPublish: true
      FunctionConfig: { Comment: Serve Lattice app routes from S3., Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (['/', '/home', '/home/', '/sources', '/sources/', '/settings', '/settings/'].indexOf(request.uri) !== -1) {
            request.uri = '/index.html';
          }
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: [!Ref DomainName]
        Comment: Lattice personal knowledge libraries
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: Website
            DomainName: !Sub ${WebsiteBucketName}.s3.${WebsiteBucketRegion}.${AWS::URLSuffix}
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: {}
          - Id: Api
            DomainName: !Ref ApiHost
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: Website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt Routes.FunctionARN }
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: Api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed CachingDisabled + AllViewerExceptHostHeader: forward
            # session cookies, query parameters, and Origin, with no caching.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${WebsiteBucketName}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
Outputs:
  DistributionId: { Value: !Ref Distribution }
  DnsTarget: { Value: !GetAtt Distribution.DomainName }
  WebsiteUrl: { Value: !Sub 'https://${DomainName}' }
